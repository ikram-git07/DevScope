<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ma Shortlist | DevScope</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script type="module" ></script>
</head>

<body class="bg-slate-100 text-slate-800 min-h-screen">


    <header class="bg-indigo-900 text-white">
        <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

            <strong class="text-xl tracking-wide">
                <span class="text-emerald-400">&lt;/&gt;</span> DevScope
            </strong>

            <nav class="flex gap-3 text-sm">
                <a href="index.html" class="px-4 py-2 rounded-lg hover:bg-indigo-800">
                    Recherche
                </a>

                <a href="shortlist.html" class="px-4 py-2 rounded-lg bg-emerald-500 text-white font-medium">
                    Shortlist
                </a>
            </nav>

        </div>
    </header>


    <main class="max-w-6xl mx-auto px-4 py-10">

        <h1 class="text-3xl font-bold text-indigo-900">
            Ma Shortlist
        </h1>

        <p class="text-slate-500 mt-2">
            Retrouvez les développeurs que vous avez sélectionnés.
        </p>

        <p class="mt-4 text-slate-600">
            <span id="nombre-candidats" class="font-bold text-emerald-600">0</span>
            candidat(s) dans votre shortlist
        </p>

        <section id="shortlist-container" class="grid grid-cols-1 md:grid-cols-2 gap-5 mt-8">

        </section>

        <div  id="aff-user" class="flex flex-col md:flex-row items-center justify-between gap-6 
                border border-green-800 rounded-2xl p-6">


           

        </div>
        <template id="candidat-template">

            <article class="bg-white rounded-xl shadow-md border border-slate-200 p-5">

                <div class="flex items-center gap-4">

                    <img id="candidat-avatar" src=""
                        class="w-16 h-16 rounded-full object-cover border-2 border-emerald-400" alt="Avatar">

                    <div>
                        <h2 id="candidat-nom" class="text-lg font-bold text-indigo-900">
                        </h2>

                        <p id="candidat-username" class="text-sm text-emerald-600">
                        </p>
                    </div>

                </div>

                <p id="candidat-language" class="text-sm text-slate-500 mt-3">
                </p>

                <p id="candidat-note" class="text-sm text-slate-500 mt-2">
                </p>

                <a id="candidat-link" href="#" target="_blank"
                    class="inline-block mt-4 text-indigo-700 font-medium text-sm hover:text-emerald-600">
                    Voir le profil GitHub →
                </a>

            </article>

        </template>

    </main>

</body>

</html>
